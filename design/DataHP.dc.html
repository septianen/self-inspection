<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Data HP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2457D6}a:hover{color:#173E9E}
</style>
</helmet>
<div style="width: 390px; height: 1180px; box-sizing: border-box; background: #FFFFFF; color: #0B1F3A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 14px; border-bottom: 1px solid #E6EBF2">
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" aria-label="Kembali" style="width: 40px; height: 40px; margin-left: -8px; border: 0; background: transparent; color: #0B1F3A; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <span style="font-size: 17px; font-weight: 700">Data HP</span>
    </div>
    
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 20px">
    <section style="display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #F2F6FF; border-radius: 14px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 14px; font-weight: 700">Terdeteksi otomatis</span>
        <span style="font-size: 12px; font-weight: 600; color: #2457D6">Dari browser</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6B82">Sistem operasi</span><span style="font-size: 14px; font-weight: 600">Android 14</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6B82">Browser</span><span style="font-size: 14px; font-weight: 600">Chrome 129</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6B82">Resolusi layar</span><span style="font-size: 14px; font-weight: 600; font-family: 'IBM Plex Mono', monospace">1080 × 2340</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6B82">RAM</span><span style="font-size: 14px; font-weight: 600">8 GB atau lebih</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6B82">Prosesor</span><span style="font-size: 14px; font-weight: 600">8 inti</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6B82">Baterai saat ini</span><span style="font-size: 14px; font-weight: 600">82%</span></div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 18px">
      <span style="font-size: 16px; font-weight: 800">Isi data HP</span>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="merek" style="font-size: 13px; font-weight: 700">Merek</label>
        <div style="position: relative">
          <select id="merek" style="width: 100%; height: 48px; padding: 0 40px 0 14px; border: 1px solid #C9D2DF; border-radius: 10px; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 15px; appearance: none">
            <option>Samsung</option><option>Xiaomi</option><option>OPPO</option><option>vivo</option><option>realme</option><option>Lainnya</option>
          </select>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 15px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="model" style="font-size: 13px; font-weight: 700">Model</label>
        <input id="model" type="text" value="Galaxy A54 5G" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D2DF; border-radius: 10px; color: #0B1F3A; font: inherit; font-size: 15px">
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 700">Penyimpanan</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <button type="button" style="height: 40px; padding: 0 16px; border: 1px solid #C9D2DF; border-radius: 20px; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 14px; font-weight: 600">64 GB</button>
          <button type="button" style="height: 40px; padding: 0 16px; border: 1px solid #C9D2DF; border-radius: 20px; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 14px; font-weight: 600">128 GB</button>
          <button type="button" aria-pressed="true" style="height: 40px; padding: 0 16px; border: 1.5px solid #3A77FF; border-radius: 20px; background: #EAF1FF; color: #1F4FC4; font: inherit; font-size: 14px; font-weight: 700">256 GB</button>
          <button type="button" style="height: 40px; padding: 0 16px; border: 1px solid #C9D2DF; border-radius: 20px; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 14px; font-weight: 600">512 GB</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="warna" style="font-size: 13px; font-weight: 700">Warna</label>
        <input id="warna" type="text" value="Hitam" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D2DF; border-radius: 10px; color: #0B1F3A; font: inherit; font-size: 15px">
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 700">Kelengkapan</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border: 1.5px solid #3A77FF; border-radius: 20px; background: #EAF1FF; color: #1F4FC4; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Dus</button>
          <button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border: 1.5px solid #3A77FF; border-radius: 20px; background: #EAF1FF; color: #1F4FC4; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Kabel data</button>
          <button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #C9D2DF; border-radius: 20px; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 14px; font-weight: 600">Kepala charger</button>
          <button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #C9D2DF; border-radius: 20px; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 14px; font-weight: 600">Nota pembelian</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 700">Kondisi fisik</span>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border: 1px solid #C9D2DF; border-radius: 10px; font-size: 14px; font-weight: 600"><input type="radio" name="fisik" style="width: 18px; height: 18px; accent-color: #3A77FF; margin: 0">Mulus, seperti baru</label>
          <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border: 1.5px solid #3A77FF; border-radius: 10px; background: #F5F8FF; font-size: 14px; font-weight: 600"><input type="radio" name="fisik" checked="" style="width: 18px; height: 18px; accent-color: #3A77FF; margin: 0">Lecet halus bekas pemakaian</label>
          <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border: 1px solid #C9D2DF; border-radius: 10px; font-size: 14px; font-weight: 600"><input type="radio" name="fisik" style="width: 18px; height: 18px; accent-color: #3A77FF; margin: 0">Ada retak atau penyok</label>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="catatan" style="font-size: 13px; font-weight: 700">Catatan <span style="font-weight: 500; color: #5B6B82">(opsional)</span></label>
        <textarea id="catatan" rows="3" style="box-sizing: border-box; padding: 12px 14px; border: 1px solid #C9D2DF; border-radius: 10px; color: #0B1F3A; font: inherit; font-size: 15px; line-height: 1.5; resize: none">Pemakaian 1,5 tahun, belum pernah servis. Garansi resmi SEIN.</textarea>
      </div>
    </section>
  </main>

  <footer style="padding: 14px 20px 28px; border-top: 1px solid #E6EBF2">
    <button type="button" style="width: 100%; height: 52px; border: 0; border-radius: 12px; background: #3A77FF; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Lanjut ke Tes</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
