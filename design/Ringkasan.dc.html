<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Ringkasan hasil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2457D6}a:hover{color:#173E9E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #0B1F3A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 14px; border-bottom: 1px solid #E6EBF2">
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" aria-label="Kembali" style="width: 40px; height: 40px; margin-left: -8px; border: 0; background: transparent; color: #0B1F3A; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <span style="font-size: 17px; font-weight: 700">Ringkasan hasil</span>
    </div>
    
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 18px 20px 0">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 46px; height: 46px; flex: none; border-radius: 12px; background: #F2F6FF; color: #3A77FF; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 16px; font-weight: 800">Samsung Galaxy A54 5G</span>
        <span style="font-size: 13px; color: #5B6B82">256 GB · Hitam · Lecet halus</span>
      </div>
      <a href="DataHP.dc.html" style="margin-left: auto; font-size: 14px; font-weight: 700; text-decoration: none">Ubah</a>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="padding: 6px 12px; border-radius: 16px; background: #E9F7EF; color: #0E6B3C; font-size: 13px; font-weight: 700">5 lulus</span>
      <span style="padding: 6px 12px; border-radius: 16px; background: #FFF1E3; color: #9A4A06; font-size: 13px; font-weight: 700">1 bermasalah</span>
      <span style="padding: 6px 12px; border-radius: 16px; background: #EEF1F5; color: #4A5568; font-size: 13px; font-weight: 700">0 dilewati</span>
    </div>

    <div style="display: flex; flex-direction: column; border: 1px solid #DDE3EC; border-radius: 14px; overflow: hidden">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
        <div style="{{row.rowStyle}}">
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
            <span style="font-size: 15px; font-weight: 700">{{row.name}}</span>
            <span style="font-size: 13px; color: #5B6B82">{{row.detail}}</span>
          </div>
          <span style="{{row.pillStyle}}">{{row.status}}</span>
          <button type="button" aria-label="Ulangi tes" style="width: 36px; height: 36px; flex: none; border: 0; border-radius: 8px; background: transparent; color: #2457D6; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0113.7-5.6L20 8.5M20 4v4.5h-4.5"></path><path d="M20 12a8 8 0 01-13.7 5.6L4 15.5M4 20v-4.5h4.5"></path></svg>
          </button>
        </div>
      </sc-for>
    </div>
  </main>

  <footer style="padding: 14px 20px 28px">
    <a href="LaporanSiap.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #3A77FF; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">Buat Laporan</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pills = {
      Lulus: 'background: #E9F7EF; color: #0E6B3C',
      Bermasalah: 'background: #FFF1E3; color: #9A4A06',
      Dilewati: 'background: #EEF1F5; color: #4A5568'
    };
    const data = [
      ['Layar sentuh', 'Semua 112 area merespons', 'Lulus'],
      ['Warna layar', 'Tidak ada titik mati atau garis', 'Lulus'],
      ['Kamera belakang', '12 MP, gambar jelas', 'Lulus'],
      ['Kamera depan', '8 MP, gambar jelas', 'Lulus'],
      ['Speaker', 'Angka tidak cocok 2 kali', 'Bermasalah'],
      ['Mikrofon', 'Suara terdeteksi dan jelas', 'Lulus']
    ];
    const rows = data.map((d, i) => ({
      name: d[0], detail: d[1], status: d[2],
      rowStyle: 'display: flex; align-items: center; gap: 10px; padding: 12px 8px 12px 14px' + (i > 0 ? '; border-top: 1px solid #E6EBF2' : ''),
      pillStyle: 'flex: none; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; ' + pills[d[2]]
    }));
    return { rows };
  }
}
</script>
</body>
</html>
