      <button type="button" style="height: 40px; padding: 0 4px; border: 0; background: transparent; color: #2457D6; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Lewati</button>

      <label style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border: 1px solid #C9D2DF; border-radius: 12px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #3A77FF; margin: 0; flex: none"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Garis</span><span style="font-size: 13px; color: #5B6B82">Garis tegak atau mendatar di layar</span></span></label>

    <button type="button" style="height: 48px; border: 1px solid #C9D2DF; border-radius: 12px; background: #FFFFFF; color: #8A97A8; font: inherit; font-size: 15px; font-weight: 700; cursor: not-allowed" disabled>Simpan masalah</button>
  </footer>
</div>
