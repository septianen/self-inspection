<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <!-- Konten sudah Bahasa Indonesia; cegah Chrome menawarkan terjemahan (bannernya menutupi layar tes) -->
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Server mengganti baris di bawah dengan <title> dan meta Open Graph (lihat server.js) -->
  <!--OG-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="report-page">
  <header class="report-header">
    <div class="logo-mark logo-mark-sm">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"></rect><path d="M9.5 12l2 2 3.5-4"></path></svg>
    </div>
    <span class="report-brand">Self Inspection</span>
    <span class="report-id" id="report-id"></span>
  </header>

  <!-- Diisi oleh report-page.js -->
  <main class="report-main" id="report-main" aria-live="polite">
    <div class="skeleton skeleton-lg"></div>
    <div class="skeleton skeleton-xl"></div>
    <div class="skeleton skeleton-md"></div>
  </main>

  <script type="module" src="/js/report-page.js"></script>
</body>
</html>
